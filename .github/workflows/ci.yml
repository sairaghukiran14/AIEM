name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]

    env:
      MONGODB_URI: mongodb://localhost:27017/aiem-ci
      AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install poppler (used by the PDF tests to read text back out of certificates)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Content, solutions and unit tests
        run: npm run verify

      - name: Build
        run: npm run build

      - name: End-to-end checks against a real database
        run: |
          # Run with email verification forced on, so the held-certificate path is exercised too.
          TRUST_PROXY_HEADERS=1 REQUIRE_EMAIL_VERIFICATION=1 npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 1
          done
          npm run e2e || { echo "--- server log ---"; cat server.log; exit 1; }
          npm run edge || { echo "--- server log ---"; cat server.log; exit 1; }
